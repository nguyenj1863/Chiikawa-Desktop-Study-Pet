name: Build, Test, and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: '6.8.3'

jobs:
  windows-x64:
    name: Windows x64 (MSVC 2022)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtmultimedia

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

      - name: Build Release
        shell: pwsh
        run: cmake --build build --parallel

      - name: Run automated tests
        shell: pwsh
        run: ctest --test-dir build --output-on-failure

      - name: Package portable Windows ZIP
        shell: pwsh
        run: .\scripts\package.ps1 -QtPrefix "$env:Qt6_DIR"

      - name: Verify ZIP contents
        shell: pwsh
        run: |
          $zip = "dist\ChiikawaStudyPet-Windows-x64.zip"
          if (-not (Test-Path $zip)) { throw "Missing $zip" }
          $size = (Get-Item $zip).Length
          Write-Host "ZIP size: $size bytes"
          if ($size -lt 5000000) { throw "ZIP unexpectedly small: $size bytes" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip)).Entries | ForEach-Object { $_.FullName }
          foreach ($req in @(
            "ChiikawaStudyPet-Windows-x64/ChiikawaStudyPet.exe",
            "ChiikawaStudyPet-Windows-x64/Qt6Core.dll",
            "ChiikawaStudyPet-Windows-x64/Qt6Widgets.dll",
            "ChiikawaStudyPet-Windows-x64/Qt6Multimedia.dll",
            "ChiikawaStudyPet-Windows-x64/platforms/qwindows.dll",
            "ChiikawaStudyPet-Windows-x64/imageformats/qgif.dll",
            "ChiikawaStudyPet-Windows-x64/LICENSE",
            "ChiikawaStudyPet-Windows-x64/THIRD_PARTY_NOTICES.md"
          )) {
            if ($entries -notcontains $req) { throw "Missing entry in ZIP: $req" }
          }
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch "project\s*\(\s*ChiikawaStudyPet[\s\S]*?VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)") { throw "No project VERSION in CMakeLists.txt" }
          $expected = $Matches[1]
          $exeVersion = (Get-Item "dist\ChiikawaStudyPet-Windows-x64\ChiikawaStudyPet.exe").VersionInfo.ProductVersion
          Write-Host "Packaged exe ProductVersion: $exeVersion (expected $expected)"
          if ($exeVersion -ne $expected) { throw "Packaged exe version $exeVersion does not match $expected" }

      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        env:
          WINDOWS_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
        run: .\scripts\package_installer.ps1 -QtPrefix "$env:Qt6_DIR" -SkipDeploy

      - name: Test Windows installer (fresh, upgrade, uninstall)
        shell: pwsh
        run: .\scripts\test_installer.ps1

      - name: Test upgrade from the latest published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previous = gh release view --repo "${{ github.repository }}" --json tagName -q .tagName
          Write-Host "Latest published release: $previous"
          gh release download $previous --repo "${{ github.repository }}" --pattern ChiikawaStudyPet-Setup-x64.exe --dir baseline-installer
          .\scripts\test_installer.ps1 -BaselineInstallerPath baseline-installer\ChiikawaStudyPet-Setup-x64.exe

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChiikawaStudyPet-Setup-x64
          path: dist/ChiikawaStudyPet-Setup-x64.exe
          if-no-files-found: error

      - name: Upload Windows portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChiikawaStudyPet-Windows-x64
          path: dist/ChiikawaStudyPet-Windows-x64.zip
          if-no-files-found: error

  macos-arm64:
    name: macOS Apple Silicon (arm64)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia

      - name: Configure CMake (arm64)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="${Qt6_DIR}"

      - name: Build Release
        run: cmake --build build --parallel

      - name: Run automated tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Package macOS arm64 DMG
        env:
          CMAKE_PREFIX_PATH: ${{ env.Qt6_DIR }}
        run: |
          chmod +x scripts/package_macos.sh
          ./scripts/package_macos.sh arm64 build

      - name: Launch smoke test (offscreen)
        run: |
          MOUNT_DIR="$(mktemp -d)"
          hdiutil attach dist/ChiikawaStudyPet-macOS-arm64.dmg -mountpoint "${MOUNT_DIR}" -nobrowse -readonly
          ls -la "${MOUNT_DIR}"
          test -d "${MOUNT_DIR}/ChiikawaStudyPet.app"
          test -f "${MOUNT_DIR}/ChiikawaStudyPet.app/Contents/MacOS/ChiikawaStudyPet"
          test -f "${MOUNT_DIR}/ChiikawaStudyPet.app/Contents/Info.plist"
          EXPECTED_VERSION="$(sed -nE 's/^[[:space:]]+VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n1)"
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${MOUNT_DIR}/ChiikawaStudyPet.app/Contents/Info.plist")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${MOUNT_DIR}/ChiikawaStudyPet.app/Contents/Info.plist")"
          echo "Bundle version ${PLIST_VERSION} (expected ${EXPECTED_VERSION}), identifier ${BUNDLE_ID}"
          if [ -z "${EXPECTED_VERSION}" ] || [ "${PLIST_VERSION}" != "${EXPECTED_VERSION}" ]; then
            hdiutil detach "${MOUNT_DIR}" -quiet || true
            echo "Error: bundle version does not match CMake project version" >&2
            exit 1
          fi
          QT_QPA_PLATFORM=offscreen "${MOUNT_DIR}/ChiikawaStudyPet.app/Contents/MacOS/ChiikawaStudyPet" &
          APP_PID=$!
          sleep 3
          if ! kill -0 "${APP_PID}" 2>/dev/null; then
            hdiutil detach "${MOUNT_DIR}" -quiet || true
            echo "Error: ChiikawaStudyPet exited prematurely during launch smoke test" >&2
            exit 1
          fi
          kill "${APP_PID}" 2>/dev/null || true
          wait "${APP_PID}" 2>/dev/null || true
          hdiutil detach "${MOUNT_DIR}" -quiet
          rmdir "${MOUNT_DIR}"

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChiikawaStudyPet-macOS-arm64
          path: dist/ChiikawaStudyPet-macOS-arm64.dmg
          if-no-files-found: error

  macos-x64:
    name: macOS Intel (x86_64)
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia

      - name: Configure CMake (x86_64)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_PREFIX_PATH="${Qt6_DIR}"

      - name: Build Release
        run: cmake --build build --parallel

      - name: Run automated tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Package macOS x64 DMG
        env:
          CMAKE_PREFIX_PATH: ${{ env.Qt6_DIR }}
        run: |
          chmod +x scripts/package_macos.sh
          ./scripts/package_macos.sh x64 build

      - name: Launch smoke test (offscreen)
        run: |
          MOUNT_DIR="$(mktemp -d)"
          hdiutil attach dist/ChiikawaStudyPet-macOS-x64.dmg -mountpoint "${MOUNT_DIR}" -nobrowse -readonly
          ls -la "${MOUNT_DIR}"
          test -d "${MOUNT_DIR}/ChiikawaStudyPet.app"
          test -f "${MOUNT_DIR}/ChiikawaStudyPet.app/Contents/MacOS/ChiikawaStudyPet"
          test -f "${MOUNT_DIR}/ChiikawaStudyPet.app/Contents/Info.plist"
          EXPECTED_VERSION="$(sed -nE 's/^[[:space:]]+VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n1)"
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${MOUNT_DIR}/ChiikawaStudyPet.app/Contents/Info.plist")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${MOUNT_DIR}/ChiikawaStudyPet.app/Contents/Info.plist")"
          echo "Bundle version ${PLIST_VERSION} (expected ${EXPECTED_VERSION}), identifier ${BUNDLE_ID}"
          if [ -z "${EXPECTED_VERSION}" ] || [ "${PLIST_VERSION}" != "${EXPECTED_VERSION}" ]; then
            hdiutil detach "${MOUNT_DIR}" -quiet || true
            echo "Error: bundle version does not match CMake project version" >&2
            exit 1
          fi
          QT_QPA_PLATFORM=offscreen "${MOUNT_DIR}/ChiikawaStudyPet.app/Contents/MacOS/ChiikawaStudyPet" &
          APP_PID=$!
          sleep 3
          if ! kill -0 "${APP_PID}" 2>/dev/null; then
            hdiutil detach "${MOUNT_DIR}" -quiet || true
            echo "Error: ChiikawaStudyPet exited prematurely during launch smoke test" >&2
            exit 1
          fi
          kill "${APP_PID}" 2>/dev/null || true
          wait "${APP_PID}" 2>/dev/null || true
          hdiutil detach "${MOUNT_DIR}" -quiet
          rmdir "${MOUNT_DIR}"

      - name: Upload macOS x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChiikawaStudyPet-macOS-x64
          path: dist/ChiikawaStudyPet-macOS-x64.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [ windows-x64, macos-arm64, macos-x64 ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          sha256sum ChiikawaStudyPet-Setup-x64.exe \
            ChiikawaStudyPet-Windows-x64.zip \
            ChiikawaStudyPet-macOS-arm64.dmg \
            ChiikawaStudyPet-macOS-x64.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          NOTES_FILE="release-notes/${TAG_NAME}.md"
          if [ ! -f "${NOTES_FILE}" ]; then
            NOTES_FILE="release_notes.md"
            cat > "${NOTES_FILE}" <<EOF
          Study Pet ${TAG_NAME} release.

          ### Downloads

          **Windows (64-bit)**
          - **Windows Installer (Recommended):** \`ChiikawaStudyPet-Setup-x64.exe\`
          - **Windows Portable:** \`ChiikawaStudyPet-Windows-x64.zip\`

          **macOS 13 (Ventura) or later**
          - **Apple Silicon:** \`ChiikawaStudyPet-macOS-arm64.dmg\`
          - **Intel Mac (x64):** \`ChiikawaStudyPet-macOS-x64.dmg\`

          Verify downloads with \`SHA256SUMS.txt\`.
          EOF
          fi

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" \
              --title "Study Pet ${TAG_NAME}" \
              --notes-file "${NOTES_FILE}"
            gh release upload "${TAG_NAME}" release-assets/* --clobber
          else
            gh release create "${TAG_NAME}" release-assets/* \
              --title "Study Pet ${TAG_NAME}" \
              --notes-file "${NOTES_FILE}"
          fi
